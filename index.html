<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דו"ח רכב עומד ארצי</title>
<style>
  :root{--bg:#f4f6fb;--surface:#fff;--surface-2:#eef1f8;--ink:#1c1e26;--ink-dim:#5f6473;--primary:#3b5bdb;--primary-dark:#2f4ac4;--fault:#e03131;--ok:#2f9e44;--radius:14px}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:12px;line-height:1.45;padding-bottom:90px}
  .container{max-width:980px;margin:0 auto}
  h1{margin:0 0 6px;font-size:1.45rem}
  .sub{color:var(--ink-dim);margin:0 0 16px;font-size:.95rem}
  .card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04)}
  label{display:block;font-size:.85rem;margin-bottom:4px;color:var(--ink-dim);font-weight:500}
  input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid transparent;border-radius:10px;background:var(--surface-2);font-size:1rem;margin-bottom:10px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);background:#fff}
  button{background:var(--primary);color:#fff;border:none;padding:11px 16px;border-radius:10px;font-size:.95rem;cursor:pointer;font-weight:600}
  button.secondary{background:#6c757d}
  button.danger{background:var(--fault)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  .status{padding:10px;border-radius:8px;margin:8px 0;display:none}
  .status.show{display:block}
  .status.ok{background:#e6f4ea;color:var(--ok)}
  .status.error{background:#fdecea;color:var(--fault)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
  .toolbar input,.toolbar select{margin:0;flex:1;min-width:140px}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  #loginScreen{max-width:380px;margin:40px auto}
  .hidden{display:none}
  .vehicle-card{position:relative;border:none;border-radius:16px;padding:14px 16px 14px 20px;margin-bottom:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.06);overflow:hidden}
  .vehicle-card::before{content:"";position:absolute;top:0;right:0;width:6px;height:100%;background:#3b5bdb}
  .vehicle-card.long::before{background:#e03131}
  .vehicle-card.medium::before{background:#f59f00}
  .vehicle-card.short::before{background:#2f9e44}
  .days{font-weight:700;color:var(--primary)}
  .fab{position:fixed;bottom:24px;left:24px;width:60px;height:60px;border-radius:50%;background:#3b5bdb;color:#fff;border:none;font-size:32px;box-shadow:0 6px 16px rgba(59,91,219,0.4);z-index:1000;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .fab:active{transform:scale(0.95)}
  @media(max-width:600px){.grid{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="container">
  <div id="loginScreen" class="card">
    <h1>דו"ח רכב עומד ארצי</h1>
    <p class="sub">הזן סיסמה כדי להיכנס</p>
    <input type="password" id="loginPassword" placeholder="סיסמה">
    <button onclick="doLogin()">כניסה</button>
    <div id="loginStatus" class="status"></div>
  </div>

  <div id="mainContent" class="hidden">
    <h1>דו"ח רכב עומד ארצי</h1>
    <p class="sub">דיווח ועדכון רכבים בטיפול</p>

    <div class="toolbar">
      <input type="text" id="searchPlate" placeholder="חיפוש לפי מספר רכב">
      <select id="filterSupervisor"><option value="">כל המפקחים</option></select>
      <button onclick="applyFilters()">סנן</button>
      <button class="secondary" onclick="loadActive()">רענון</button>
      <button class="ok" onclick="exportCSV()">Excel</button>
      <button class="secondary" onclick="exportPDF()">PDF</button>
    </div>

    <div id="board" class="card">
      <h2 style="margin:0 0 12px;font-size:1.15rem">
        כלי רכב במוסך כרגע
        <span id="vehicleCount" style="background:#3b5bdb;color:#fff;padding:2px 10px;border-radius:12px;font-size:0.9rem;margin-right:8px;">0</span>
      </h2>
      <div id="boardList">טוען...</div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 12px;font-size:1.15rem" id="formTitle">דיווח חדש</h2>
      <form id="reportForm" onsubmit="return submitReport(event)">
        <input type="hidden" name="id" id="editId">
        <div class="grid">
          <div><label>מספר רכב *</label><input type="text" name="plate" required></div>
          <div><label>שם המפקח *</label><input type="text" name="supervisor" required></div>
          <div><label>מוסך מטפל</label><input type="text" name="garage"></div>
          <div><label>תאריך כניסה *</label><input type="date" name="entryDate" required></div>
          <div>
            <label>אגף/מחוז *</label>
            <select name="department" required>
              <option value="">בחרו</option>
              <option>צפון</option><option>דרום</option><option>מרכז</option>
              <option>ירושלים</option><option>תל אביב</option><option>חוף</option>
              <option>ש״י</option><option>מג״ב</option><option>משמר לאומי</option>
              <option>את״ן</option><option>אג״מ</option><option>אח״מ</option>
              <option>להב</option><option>את״ל</option><option>אג״ת</option>
              <option>אמ״ש</option><option>אה״ד</option><option>אק״מ</option>
            </select>
          </div>
          <div>
            <label>סוג שירות *</label>
            <select name="serviceType" required>
              <option value="">בחרו</option>
              <option>תחזוקה</option>
              <option>תיקון תאונה/נזק</option>
            </select>
          </div>
          <div>
            <label>שנת דגם</label>
            <select name="modelYear" id="modelYearSelect"><option value="">בחרו</option></select>
          </div>
          <div>
            <label>תיאור תקלה *</label>
            <select name="faultDesc" required>
              <option value="">בחרו</option>
              <option>מנוע</option><option>גיר</option><option>חשמל ואלקטרוניקה</option>
              <option>מערכת קירור</option><option>מערכת פליטה</option><option>נזילות שמן</option>
              <option>מערכת היגוי</option><option>מערכת העברת הכח</option><option>בולמים</option>
              <option>מערכת ABS</option><option>כריות אוויר</option><option>תיקון ת.ד / נזק</option>
            </select>
          </div>
          <div><label>חלק הנדרש להחלפה</label><input type="text" name="partToReplace"></div>
          <div>
            <label>סיבת שהיה *</label>
            <select name="stayReason" required>
              <option value="">בחרו</option>
              <option>ממתין לאבחון</option><option>ממתין להצעה</option><option>ממתין לשמאי</option>
              <option>עבודה</option><option>חלפים</option><option>ממתין לאישור ענבל</option>
              <option>ממתין לאישור מדור</option><option>ממתין להחלטת תיקון / השבתה</option>
            </select>
          </div>
          <div>
            <label>רכב חליפי</label>
            <select name="replacementCar"><option value="">בחרו</option><option>כן</option><option>לא</option></select>
          </div>
          <div>
            <label>רכב באחריות</label>
            <select name="underWarranty"><option value="">בחרו</option><option>כן</option><option>לא</option></select>
          </div>
        </div>
        <div><label>התייחסות מפקח</label><textarea name="supervisorNote" rows="3"></textarea></div>
        <div class="actions">
          <button type="submit" id="submitBtn">שלח דיווח</button>
          <button type="button" class="secondary" onclick="resetForm()" id="cancelEdit" style="display:none">ביטול עריכה</button>
        </div>
        <div id="formStatus" class="status"></div>
      </form>
    </div>
  </div>
</div>

<button class="fab" onclick="document.getElementById('reportForm').scrollIntoView({behavior:'smooth'})">+</button>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLBOT8JS6nTdpRInwTfYAi0hIe1ytJtY1YA38EbCCwqGOygZ-7b-wzmAIUyWibwIga-A/exec";
let currentPassword = "";
let allItems = [];

(function fillYears(){
  const sel = document.getElementById("modelYearSelect");
  for(let y=2027; y>=1970; y--){
    const o = document.createElement("option");
    o.value = o.textContent = y;
    sel.appendChild(o);
  }
})();

function jsonp(params) {
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    const timeout = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 25000);
    function cleanup() { clearTimeout(timeout); delete window[cb]; script.remove(); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    params.callback = cb;
    params.password = currentPassword;
    script.src = APPS_SCRIPT_URL + "?" + new URLSearchParams(params).toString();
    script.onerror = () => { cleanup(); reject(new Error("network")); };
    document.body.appendChild(script);
  });
}

function showStatus(el, msg, kind) {
  el.textContent = msg;
  el.className = "status show " + kind;
  setTimeout(() => el.classList.remove("show"), 4000);
}

function doLogin() {
  currentPassword = document.getElementById("loginPassword").value.trim();
  if (!currentPassword) return;
  jsonp({ action: "list" }).then(data => {
    if (data.error) {
      showStatus(document.getElementById("loginStatus"), data.error, "error");
      currentPassword = "";
    } else {
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("mainContent").classList.remove("hidden");
      allItems = data.items || [];
      populateSupervisors();
      renderBoard(allItems);
      document.querySelector('input[name="entryDate"]').value = new Date().toISOString().slice(0,10);
    }
  }).catch(() => showStatus(document.getElementById("loginStatus"), "שגיאת תקשורת", "error"));
}

function loadActive() {
  document.getElementById("searchPlate").value = "";
  document.getElementById("filterSupervisor").value = "";
  jsonp({ action: "list" }).then(data => {
    allItems = data.items || [];
    populateSupervisors();
    renderBoard(allItems);
  });
}

function populateSupervisors() {
  const sel = document.getElementById("filterSupervisor");
  const current = sel.value;
  const names = [...new Set(allItems.map(i => i.supervisor).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">כל המפקחים</option>' + names.map(n => `<option>${n}</option>`).join("");
  if (names.includes(current)) sel.value = current;
}

function applyFilters() {
  const plate = document.getElementById("searchPlate").value.trim().toLowerCase();
  const sup = document.getElementById("filterSupervisor").value;
  let filtered = allItems;
  if (plate) filtered = filtered.filter(i => String(i.plate).toLowerCase().includes(plate));
  if (sup) filtered = filtered.filter(i => i.supervisor === sup);
  renderBoard(filtered);
}

function daysSince(dateStr) {
  if (!dateStr) return "–";
  const d = new Date(dateStr.slice(0,10));
  if (isNaN(d)) return "–";
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.round((now - d) / 86400000);
  return diff === 0 ? "היום" : diff === 1 ? "יום 1" : diff + " ימים";
}

function daysSinceNum(dateStr) {
  if (!dateStr) return 0;
  const d = new Date(dateStr.slice(0,10));
  if (isNaN(d)) return 0;
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((now - d) / 86400000);
}

function renderBoard(items) {
  const list = document.getElementById("boardList");
  const countEl = document.getElementById("vehicleCount");
  if (countEl) countEl.textContent = items.length;
  if (!items.length) { list.innerHTML = "<p>אין רכבים להצגה</p>"; return; }
  list.innerHTML = items.map(it => {
    const daysNum = it.exitDate ? 0 : daysSinceNum(it.entryDate);
    const daysText = it.exitDate ? "יצא" : daysSince(it.entryDate);
    let statusClass = "short";
    if (!it.exitDate && daysNum >= 14) statusClass = "long";
    else if (!it.exitDate && daysNum >= 7) statusClass = "medium";
    return `<div class="vehicle-card ${statusClass}">
      <strong style="font-size:1.1rem">${it.plate||"–"}</strong>
      <span class="days" style="float:left">${daysText}</span><br>
      <div style="margin-top:6px;font-size:0.92rem;color:#444">
        מפקח: ${it.supervisor||"–"}<br>
        מוסך: ${it.garage||"–"}<br>
        אגף: ${it.department||"–"} | ${it.serviceType||"–"}<br>
        תקלה: ${it.faultDesc||"–"}
      </div>
      <div class="actions">
        ${!it.exitDate ? `<button class="danger" onclick="markExit('${it.id}')">יצא</button>` : ""}
        <button class="secondary" onclick="editReport('${it.id}')">עריכה</button>
      </div>
    </div>`;
  }).join("");
}

function markExit(id) {
  if (!confirm("לסמן שהרכב יצא מהמוסך?")) return;
  jsonp({ action: "exit", id }).then(data => {
    if (data.success) { alert("סומן בהצלחה"); loadActive(); }
    else alert(data.error || "שגיאה");
  });
}

function editReport(id) {
  jsonp({ action: "getOne", id }).then(data => {
    if (!data.item) return alert("לא נמצא");
    const it = data.item;
    const form = document.getElementById("reportForm");
    form.id.value = it.id;
    form.plate.value = it.plate || "";
    form.supervisor.value = it.supervisor || "";
    form.garage.value = it.garage || "";

    let entryDate = it.entryDate || "";
    if (entryDate) {
      const d = new Date(entryDate);
      if (!isNaN(d)) entryDate = d.toISOString().slice(0, 10);
    }
    form.entryDate.value = entryDate;

    form.department.value = it.department || "";
    form.serviceType.value = it.serviceType || "";
    form.modelYear.value = it.modelYear || "";
    form.faultDesc.value = it.faultDesc || "";
    form.partToReplace.value = it.partToReplace || "";
    form.stayReason.value = it.stayReason || "";
    form.replacementCar.value = it.replacementCar || "";
    form.underWarranty.value = it.underWarranty || "";
    form.supervisorNote.value = it.supervisorNote || "";

    document.getElementById("formTitle").textContent = "עריכת דיווח";
    document.getElementById("submitBtn").textContent = "עדכן דיווח";
    document.getElementById("cancelEdit").style.display = "inline-block";
    form.scrollIntoView({behavior:"smooth"});
  });
}

function resetForm() {
  const form = document.getElementById("reportForm");
  form.reset();
  form.id.value = "";
  document.getElementById("formTitle").textContent = "דיווח חדש";
  document.getElementById("submitBtn").textContent = "שלח דיווח";
  document.getElementById("cancelEdit").style.display = "none";
  document.querySelector('input[name="entryDate"]').value = new Date().toISOString().slice(0,10);
}

function submitReport(ev) {
  ev.preventDefault();
  const form = ev.target;
  const data = new FormData(form);
  const isEdit = !!form.id.value;
  const params = { action: isEdit ? "update" : "add" };
  for (const [k, v] of data.entries()) params[k] = v;
  const statusEl = document.getElementById("formStatus");
  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "שולח...";
  jsonp(params).then(res => {
    if (res && res.success) {
      showStatus(statusEl, isEdit ? "הדיווח עודכן בהצלחה" : "הדיווח נשלח בהצלחה", "ok");
      resetForm();
      loadActive();
    } else {
      showStatus(statusEl, (res && res.error) || "שגיאה בשמירה", "error");
    }
  }).catch(() => showStatus(statusEl, "שגיאת תקשורת", "error"))
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = isEdit ? "עדכן דיווח" : "שלח דיווח";
    });
  return false;
}

function exportCSV() {
  if (!allItems.length) return alert("אין נתונים");
  const headersHe = ["מספר רכב","מפקח","מוסך","תאריך כניסה","אגף","סוג שירות","שנת דגם","תקלה","חלק","סיבת שהייה","חליפי","באחריות","התייחסות","יציאה","ימי שהייה"];
  const headersEn = ["plate","supervisor","garage","entryDate","department","serviceType","modelYear","faultDesc","partToReplace","stayReason","replacementCar","underWarranty","supervisorNote","exitDate"];
  const rows = [headersHe.join(",")];
  allItems.forEach(it => {
    const days = it.exitDate ? "" : daysSince(it.entryDate);
    const values = headersEn.map(h => (it[h]||"").toString().replace(/"/g,'""'));
    values.push(days);
    rows.push(values.map(v=>`"${v}"`).join(","));
  });
  const blob = new Blob(["\uFEFF"+rows.join("\n")], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `דוח_רכב_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function exportPDF() {
  if (!allItems.length) return alert("אין נתונים");
  const win = window.open("", "_blank");
  const today = new Date().toLocaleDateString("he-IL");
  win.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>דו"ח רכב עומד ארצי</title>
  <style>body{font-family:Arial;direction:rtl;margin:20px}h1{text-align:center}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#2b6cb0;color:#fff;padding:8px}td{border:1px solid #ddd;padding:6px}tr:nth-child(even){background:#f7fafc}</style>
  </head><body><h1>דו"ח רכב עומד ארצי</h1><p style="text-align:center">תאריך: ${today} | סה"כ: ${allItems.length}</p>
  <table><thead><tr><th>מספר רכב</th><th>מפקח</th><th>מוסך</th><th>כניסה</th><th>אגף</th><th>סוג</th><th>תקלה</th><th>סיבה</th><th>ימים</th><th>התייחסות</th></tr></thead>
  <tbody>${allItems.map(it=>`<tr><td><b>${it.plate||""}</b></td><td>${it.supervisor||""}</td><td>${it.garage||""}</td><td>${it.entryDate||""}</td><td>${it.department||""}</td><td>${it.serviceType||""}</td><td>${it.faultDesc||""}</td><td>${it.stayReason||""}</td><td>${it.exitDate?"יצא":daysSince(it.entryDate)}</td><td>${it.supervisorNote||""}</td></tr>`).join("")}</tbody></table>
  </body></html>`);
  win.document.close();
  win.focus();
  setTimeout(()=>win.print(), 400);
}
</script>
</body>
</html>
